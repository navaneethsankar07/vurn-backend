<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Vurn{% endblock %}</title>
  </head>

  <body
    style="
      margin: 0;
      padding: 0;
      background-color: #f4f4f5;
      font-family: Arial, Helvetica, sans-serif;
      color: #18181b;
    "
  >
    <table
      width="100%"
      cellpadding="0"
      cellspacing="0"
      border="0"
      style="background-color: #f4f4f5; padding: 40px 16px"
    >
      <tr>
        <td align="center">
          <table
            width="100%"
            cellpadding="0"
            cellspacing="0"
            border="0"
            style="
              max-width: 560px;
              background-color: #ffffff;
              border: 1px solid #e4e4e7;
              border-radius: 8px;
            "
          >
            <!-- Header -->
            <tr>
              <td
                style="
                  padding: 28px 32px 20px;
                  border-bottom: 1px solid #e4e4e7;
                "
              >
                <div style="font-size: 24px; font-weight: 700; color: #18181b">
                  Vurn
                </div>
              </td>
            </tr>

            <!-- Content -->
            <tr>
              <td style="padding: 32px">{% block content %} {% endblock %}</td>
            </tr>

            <!-- Footer -->
            <tr>
              <td style="padding: 20px 32px; border-top: 1px solid #e4e4e7">
                <p
                  style="
                    margin: 0 0 8px;
                    font-size: 12px;
                    line-height: 18px;
                    color: #71717a;
                  "
                >
                  This is an automated message from Vurn. Please do not reply to
                  this email.
                </p>

                <p
                  style="
                    margin: 0;
                    font-size: 12px;
                    line-height: 18px;
                    color: #a1a1aa;
                  "
                >
                  © Vurn
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
